server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache index.html — always serve the latest entry point
    # so browsers pick up newly hashed JS/CSS filenames after each deploy
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # SPA fallback for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressively cache hashed static assets (JS/CSS/images)
    # Safe because Vite adds a content hash to every filename on every build
    location ~* \.(ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
