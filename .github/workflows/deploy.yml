name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & Build Check
  # ─────────────────────────────────────────────
  build-check:
    name: Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        # Uses a dummy API URL; the real one is proxied by Nginx in production
        env:
          VITE_API_BASE_URL: "https://api.sofolkrishok.example.com"
        run: npm run build

  # ─────────────────────────────────────────────
  # JOB 2: Build & Push Docker Image
  # (Only runs on push to main, after build passes)
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sofolkrishok-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sofolkrishok-frontend:${{ github.sha }}

  # ─────────────────────────────────────────────
  # JOB 3: Deploy to DigitalOcean Droplet via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: SSH into droplet and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            echo "Pulling latest frontend image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/sofolkrishok-frontend:latest

            echo "Stopping old container..."
            docker stop sofolkrishok-frontend || true
            docker rm sofolkrishok-frontend || true

            echo "Starting new container..."
            docker run -d \
              --name sofolkrishok-frontend \
              --restart always \
              -p 3000:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/sofolkrishok-frontend:latest

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Frontend deployed successfully!"
